<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Vanilla JS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 20px;">
            <div>
                <h1>Panel de Tareas (Vanilla JS)</h1>
                <p>Conectado como; <strong id="currentUser" style="color: #2563eb;"></strong></p>
            </div>
            <button id="logoutBtn" style="width: auto; background-color: #ef4444; padding: 8px 15px; font-size: 0.85rem; color: white; border: none; border-radius: 5px; cursor: pointer;">
                Cerrar sesión
            </button>
        </header>

        <form id="taskForm">
            <input type="text" id="taskTitle" placeholder="¿Que necesitas hacer?" required>
            <textarea id="taskDescripcion" placeholder="Descripcion (opcional)..." rows="2"></textarea>
            <button type="submit">Agregar Tarea</button>
        </form>

        <main>
            <h2>Tus tareas</h2>
            <div id="taskContainer"></div>
        </main>
    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle">Mensaje del sistema</h3>
            <p> id="modalMessage">Aqui va el texto explicativo.</p>
            <div class="modal-buttons">
                <button> id="modalCancelBtn" class="btn-secondary">Cancelar</button>
                <button id="modalConfirmBtn" class="btn-primary">Aceptar</button>
            </div>
        </div>
    </div>

    <div id="loginModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Identificacion de Autor</h3>
            <p>Por favor, ingresa tu nombre para comenzar a gestionar tus tareas:</p>
            <form id="loginForm" style="box-shadow: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px;">
                <input type="text" id="loginInput" placeholder="Ej. Dhaniel, Ana..." required>
                <div class="modal-buttons">
                    <button type="submit" class="btn-primary">Ingresar al panel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
